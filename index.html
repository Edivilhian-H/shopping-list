<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>quicklist</title>

    <link rel="stylesheet" href="styles/index.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Sora:wght@100..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="desktop-only">
      <div class="container">
        <img src="./assets/img/logo-img.svg" alt="" />
        <h1>quicklist</h1>
      </div>
    </header>

    <main>
      <div class="container">
        <div class="fixed">
          <div class="back">
            <a href="#">
              <img src="./assets/icons/arrow.svg" alt="Botão de voltar"
            /></a>
          </div>

          <h1>Compras da semana</h1>

          <form action="">
            <input
              type="text"
              class="input-text"
              placeholder="Adicione um novo item"
              id="item"
            />
            <button class="btn" id="addIten">Adicionar item</button>
          </form>
        </div>
        <ul role="list"></ul>
      </div>
    </main>

    <footer>
      <div class="alert container hiden">
        <img src="./assets/icons/erro.svg" alt="" />
        <span>O item foi removido da lista</span>
        <button type="button" aria-label="Fechar mensagem">
          <img src="./assets/icons/delete.svg" alt="" />
        </button>
      </div>
    </footer>

    <script src="./scripts.js"></script>
  </body>
</html>
